<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Subtle Slate) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Subtle Technical Grid Pattern -->
    <pattern id="microGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.3" />
    </pattern>

    <!-- Terminal Window Drop Shadow -->
    <filter id="terminalShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.12" />
    </filter>

    <!-- Window Border Subtle Gradient -->
    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Monaco, Consolas, monospace; }
    .title { font-weight: 800; fill: #FFFFFF; letter-spacing: -0.03em; }
    .brand-accent { fill: #10B981; }
    .subtitle { font-weight: 500; fill: #E2E8F0; }
    .desc { font-weight: 400; fill: #94A3B8; }
    .chip-text { font-size: 12px; font-weight: 600; fill: #CBD5E1; }
    .term-header { font-size: 11px; font-weight: 500; fill: #64748B; letter-spacing: 0.02em; }
    .term-code { font-size: 12.5px; line-height: 1.55; }
    .c-gray { fill: #64748B; }
    .c-light { fill: #F1F5F9; }
    .c-green { fill: #34D399; }
    .c-blue { fill: #60A5FA; }
    .c-yellow { fill: #FBBF24; }
    .c-cyan { fill: #38BDF8; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#microGrid)" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="378" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- ================= LEFT COLUMN: BRANDING & SPECS ================= -->
  <g transform="translate(68, 52)">
    <!-- Pill Badge: Release & Open Source -->
    <g transform="translate(0, 0)">
      <rect width="250" height="28" rx="14" fill="#0F243A" stroke="#1E3A8A" stroke-width="1.2" />
      <circle cx="16" cy="14" r="4.5" fill="#10B981" />
      <text x="30" y="18.5" class="font-mono" font-size="11.5" font-weight="700" fill="#38BDF8" letter-spacing="0.04em">ARAS 1.0 • OPEN SOURCE</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 52)">
      <text x="0" y="44" class="font-sans title" font-size="54">KASTOR AI<tspan class="brand-accent">.</tspan></text>
    </g>

    <!-- Subtitle & Value Proposition -->
    <text x="0" y="132" class="font-sans subtitle" font-size="19">
      Multi-Group WhatsApp Classroom Management Engine
    </text>
    <text x="0" y="160" class="font-sans desc" font-size="14.5">
      Automated Vocational High School (SMK) Schedule • Transparent Cash Ledger • Web Dashboard
    </text>

    <!-- Capability Chips (Linear Minimalist Style) -->
    <g transform="translate(0, 204)">
      <!-- Chip 1: WhatsApp Baileys -->
      <g transform="translate(0, 0)">
        <rect width="168" height="32" rx="7" fill="#131C2E" stroke="#25334D" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#22C55E" />
        <text x="28" y="20.5" class="font-sans chip-text">WhatsApp Baileys v7</text>
      </g>

      <!-- Chip 2: Multi-Runtime -->
      <g transform="translate(178, 0)">
        <rect width="186" height="32" rx="7" fill="#131C2E" stroke="#25334D" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#38BDF8" />
        <text x="28" y="20.5" class="font-sans chip-text">Node.js • Deno • Bun</text>
      </g>

      <!-- Chip 3: SQLite WAL -->
      <g transform="translate(374, 0)">
        <rect width="154" height="32" rx="7" fill="#131C2E" stroke="#25334D" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#A855F7" />
        <text x="28" y="20.5" class="font-sans chip-text">SQLite WAL Mode</text>
      </g>
    </g>

    <!-- Sub-row chips: 5-Tier RBAC & Dual Engine -->
    <g transform="translate(0, 244)">
      <g transform="translate(0, 0)">
        <rect width="168" height="32" rx="7" fill="#131C2E" stroke="#25334D" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#F59E0B" />
        <text x="28" y="20.5" class="font-sans chip-text">5-Tier Role RBAC</text>
      </g>

      <g transform="translate(178, 0)">
        <rect width="186" height="32" rx="7" fill="#131C2E" stroke="#25334D" stroke-width="1" />
        <circle cx="16" cy="16" r="3.5" fill="#10B981" />
        <text x="28" y="20.5" class="font-sans chip-text">Zero Lock Contention</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: REALISTIC TERMINAL MOCKUP ================= -->
  <g transform="translate(635, 42)" filter="url(#terminalShadow)">
    <!-- Terminal Outer Frame -->
    <rect width="500" height="296" rx="10" fill="#0D1117" stroke="url(#windowBorder)" stroke-width="1.5" />

    <!-- Terminal Window Top Bar -->
    <rect width="500" height="36" rx="10" fill="#161B22" />
    <!-- Clip bottom round corners of top bar -->
    <rect y="26" width="500" height="10" fill="#161B22" />
    <line x1="0" y1="36" x2="500" y2="36" stroke="#21262D" stroke-width="1" />

    <!-- macOS / Linux Window Controls -->
    <circle cx="20" cy="18" r="5" fill="#EF4444" />
    <circle cx="36" cy="18" r="5" fill="#F59E0B" />
    <circle cx="52" cy="18" r="5" fill="#10B981" />

    <!-- Terminal Tab Title -->
    <text x="250" y="22" text-anchor="middle" class="font-mono term-header">node bot/index.js — aras-daemon</text>

    <!-- Terminal Content Area -->
    <g transform="translate(20, 58)" class="font-mono term-code">
      <!-- Line 1: Startup command -->
      <text x="0" y="0"><tspan class="c-green">$</tspan> <tspan class="c-light">node bot/index.js</tspan></text>
      
      <!-- Line 2: Socket init -->
      <text x="0" y="22"><tspan class="c-green">✓</tspan> <tspan class="c-gray">[SOCKET]</tspan> <tspan class="c-light">WhatsApp Baileys v7.0.0 connected</tspan></text>
      
      <!-- Line 3: SQLite WAL -->
      <text x="0" y="44"><tspan class="c-cyan">✓</tspan> <tspan class="c-gray">[DB]</tspan> <tspan class="c-light">SQLite WAL active</tspan> <tspan class="c-gray">(36 students, XI RPL C)</tspan></text>

      <!-- Line 4: Web dashboard port -->
      <text x="0" y="66"><tspan class="c-cyan">✓</tspan> <tspan class="c-gray">[WEB]</tspan> <tspan class="c-light">Dashboard live on</tspan> <tspan class="c-blue">http://localhost:3001</tspan></text>

      <!-- Separator line in terminal -->
      <line x1="0" y1="84" x2="460" y2="84" stroke="#21262D" stroke-width="1" />

      <!-- Line 5: Incoming message simulation -->
      <text x="0" y="106"><tspan class="c-yellow">⚡ [MSG]</tspan> <tspan class="c-gray">Grup XI RPL C »</tspan> <tspan class="c-yellow">/jadwal</tspan></text>

      <!-- Line 6: Bot reply simulation -->
      <text x="0" y="128"><tspan class="c-green">🤖 [REPLY]</tspan> <tspan class="c-light">📅 Jadwal Hari Ini: </tspan><tspan class="c-cyan">Pemrograman Web</tspan></text>
      <text x="18" y="148"><tspan class="c-gray">├─ Ruang: </tspan><tspan class="c-light">Lab Komputer 3 (Blok Bengkel)</tspan></text>
      <text x="18" y="168"><tspan class="c-yellow">└─ Peringatan: </tspan><tspan class="c-yellow">Wajib Wearpack &amp; Safety Shoes</tspan></text>

      <!-- Line 7: Next prompt waiting cursor -->
      <g transform="translate(0, 196)">
        <text x="0" y="0"><tspan class="c-green">$</tspan> <tspan class="c-gray">listening for events...</tspan></text>
        <rect x="184" y="-11" width="7" height="14" fill="#34D399" opacity="0.85" />
      </g>
    </g>
  </g>
</svg>