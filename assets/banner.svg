<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="glowBlue" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #F8FAFC; letter-spacing: -0.03em; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #94A3B8; }
    .pill-text { font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #38BDF8; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#grid)" />
  <rect width="1200" height="380" fill="url(#glowBlue)" />
  <rect width="1200" height="380" fill="url(#glowEmerald)" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="378" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Content Container -->
  <g transform="translate(80, 55)">
    <!-- Version Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="150" height="28" rx="14" fill="#0F243A" stroke="#1E3A8A" stroke-width="1.2" />
      <circle cx="16" cy="14" r="5" fill="#10B981" />
      <text x="32" y="19" class="pill-text">ARAS 1.0 CORE</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 68)">
      <text x="0" y="50" class="title" font-size="62">KASTOR AI</text>
      <text x="375" y="50" class="title" font-size="62" fill="url(#logoGrad)">.</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="156" class="subtitle" font-size="20">
      Multi-Group WhatsApp Classroom Management Engine &amp; Web Administration Dashboard
    </text>
    <text x="0" y="186" class="subtitle" font-size="16" fill="#64748B">
      Designed for Vocational High Schools (SMK) • Dual Engine WAL Architecture • Zero Lock Contention
    </text>

    <!-- Capability Feature Badges -->
    <g transform="translate(0, 220)">
      <!-- Badge 1: WhatsApp Baileys -->
      <g transform="translate(0, 0)">
        <rect width="175" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="17" r="4" fill="#22C55E" />
        <text x="32" y="22" class="tag" fill="#E2E8F0">WhatsApp Baileys v7</text>
      </g>

      <!-- Badge 2: SQLite WAL -->
      <g transform="translate(187, 0)">
        <rect width="155" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="17" r="4" fill="#38BDF8" />
        <text x="32" y="22" class="tag" fill="#E2E8F0">SQLite WAL Mode</text>
      </g>

      <!-- Badge 3: Multi-Runtime -->
      <g transform="translate(354, 0)">
        <rect width="180" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="17" r="4" fill="#A855F7" />
        <text x="32" y="22" class="tag" fill="#E2E8F0">Deno • Bun • Node.js</text>
      </g>

      <!-- Badge 4: Role-Based Access Control -->
      <g transform="translate(546, 0)">
        <rect width="165" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="17" r="4" fill="#F59E0B" />
        <text x="32" y="22" class="tag" fill="#E2E8F0">5-Tier Role RBAC</text>
      </g>
    </g>
  </g>

  <!-- Geometric Illustration Right Side -->
  <g transform="translate(930, 95)" opacity="0.85">
    <!-- Outer Hex Shield -->
    <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,4" />
    <polygon points="100,25 165,62 165,138 100,175 35,138 35,62" fill="#0F172A" stroke="#3B82F6" stroke-width="2.5" />
    
    <!-- Central Circuit Nodes -->
    <circle cx="100" cy="100" r="28" fill="#1E293B" stroke="#10B981" stroke-width="3" />
    <circle cx="100" cy="100" r="10" fill="#38BDF8" />
    
    <!-- Connector Lines -->
    <line x1="100" y1="25" x2="100" y2="72" stroke="#60A5FA" stroke-width="2" />
    <line x1="100" y1="128" x2="100" y2="175" stroke="#60A5FA" stroke-width="2" />
    <line x1="35" y1="100" x2="72" y2="100" stroke="#34D399" stroke-width="2" />
    <line x1="128" y1="100" x2="165" y2="100" stroke="#34D399" stroke-width="2" />
    
    <!-- Satellite Dots -->
    <circle cx="100" cy="25" r="4" fill="#60A5FA" />
    <circle cx="100" cy="175" r="4" fill="#60A5FA" />
    <circle cx="35" cy="100" r="4" fill="#34D399" />
    <circle cx="165" cy="100" r="4" fill="#34D399" />
  </g>
</svg>
