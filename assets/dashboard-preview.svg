<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="metricCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="primaryBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', monospace, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .bold { font-weight: 700; }
    .semibold { font-weight: 600; }
    .regular { font-weight: 400; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgCanvas)" />

  <!-- Window Frame -->
  <g transform="translate(30, 25)">
    <!-- Outer Browser Container -->
    <rect width="1140" height="630" rx="12" fill="#090D16" stroke="#1E293B" stroke-width="1.5" />

    <!-- Browser Header Bar -->
    <rect width="1140" height="42" rx="12" fill="#0F172A" />
    <path d="M 0 30 L 0 42 L 1140 42 L 1140 30 Z" fill="#0F172A" />
    <line x1="0" y1="42" x2="1140" y2="42" stroke="#1E293B" stroke-width="1" />

    <!-- Window Controls (Red, Yellow, Green) -->
    <circle cx="24" cy="21" r="5.5" fill="#EF4444" />
    <circle cx="42" cy="21" r="5.5" fill="#F59E0B" />
    <circle cx="60" cy="21" r="5.5" fill="#10B981" />

    <!-- Address Bar -->
    <rect x="280" y="8" width="580" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <circle cx="298" cy="21" r="3.5" fill="#10B981" />
    <text x="312" y="25" class="mono" font-size="12" fill="#94A3B8">http://localhost:3001/ — Dashboard Administrasi XI RPL C</text>

    <!-- App Body Area (Below Header) -->
    <g transform="translate(0, 42)">
      <!-- Sidebar (Width: 220) -->
      <rect width="220" height="588" fill="#090D16" />
      <line x1="220" y1="0" x2="220" y2="588" stroke="#1E293B" stroke-width="1" />

      <!-- Sidebar Brand Mark -->
      <g transform="translate(20, 20)">
        <rect width="32" height="32" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2" />
        <polygon points="16,8 24,24 8,24" fill="#38BDF8" opacity="0.9" />
        <text x="42" y="16" class="sans bold" font-size="15" fill="#F8FAFC">KASTOR AI</text>
        <text x="42" y="29" class="mono" font-size="10" fill="#38BDF8">ARAS 1.0</text>
      </g>

      <!-- Sidebar Menu Items -->
      <g transform="translate(14, 75)">
        <!-- Active Item: Dashboard -->
        <rect width="192" height="38" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="0.8" />
        <circle cx="20" cy="19" r="4" fill="#38BDF8" />
        <text x="36" y="24" class="sans semibold" font-size="13" fill="#F8FAFC">Dashboard Ringkas</text>

        <!-- Menu Item: Jadwal Blok -->
        <g transform="translate(0, 46)">
          <text x="36" y="24" class="sans regular" font-size="13" fill="#94A3B8">Jadwal Blok KBM</text>
        </g>

        <!-- Menu Item: Kas Kelas -->
        <g transform="translate(0, 84)">
          <text x="36" y="24" class="sans regular" font-size="13" fill="#94A3B8">Buku Kas &amp; Keuangan</text>
        </g>

        <!-- Menu Item: Tugas / PR -->
        <g transform="translate(0, 122)">
          <text x="36" y="24" class="sans regular" font-size="13" fill="#94A3B8">Tugas &amp; Agenda PR</text>
        </g>

        <!-- Menu Item: Siswa -->
        <g transform="translate(0, 160)">
          <text x="36" y="24" class="sans regular" font-size="13" fill="#94A3B8">Biodata Siswa &amp; Ortu</text>
        </g>

        <!-- Menu Item: Struktur -->
        <g transform="translate(0, 198)">
          <text x="36" y="24" class="sans regular" font-size="13" fill="#94A3B8">Struktur Pengurus</text>
        </g>

        <!-- Menu Item: Developer Console -->
        <g transform="translate(0, 236)">
          <text x="36" y="24" class="sans regular" font-size="13" fill="#64748B">Developer Console</text>
        </g>
      </g>

      <!-- Main Dashboard Content Area -->
      <g transform="translate(240, 0)">
        <!-- Top Navigation / Breadcrumb -->
        <g transform="translate(0, 20)">
          <text x="0" y="20" class="sans bold" font-size="20" fill="#F8FAFC">Ringkasan Eksekutif Kelas</text>
          <text x="0" y="38" class="sans regular" font-size="12" fill="#64748B">Semester Ganjil 2026/2027 • Minggu ke-16 Aktif KBM</text>

          <!-- Class Chip & User Status -->
          <g transform="translate(680, 0)">
            <rect width="180" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
            <circle cx="16" cy="16" r="4" fill="#22C55E" />
            <text x="28" y="20" class="sans semibold" font-size="12" fill="#F8FAFC">XI RPL C</text>
            <text x="96" y="20" class="sans regular" font-size="11" fill="#94A3B8">| KETUA</text>
          </g>
        </g>

        <!-- Metric Cards Row (4 Cards) -->
        <g transform="translate(0, 75)">
          <!-- Card 1: Saldo Kas -->
          <g transform="translate(0, 0)">
            <rect width="202" height="95" rx="10" fill="url(#metricCardGrad)" stroke="#1E293B" stroke-width="1" />
            <text x="16" y="28" class="sans regular" font-size="11" fill="#94A3B8">TOTAL SALDO KAS</text>
            <text x="16" y="58" class="mono bold" font-size="20" fill="#10B981">Rp555.000</text>
            <text x="16" y="78" class="sans regular" font-size="10" fill="#64748B">36 Siswa • Rp5.000/mg</text>
          </g>

          <!-- Card 2: Siswa Terdaftar -->
          <g transform="translate(218, 0)">
            <rect width="202" height="95" rx="10" fill="url(#metricCardGrad)" stroke="#1E293B" stroke-width="1" />
            <text x="16" y="28" class="sans regular" font-size="11" fill="#94A3B8">SISWA TERDAFTAR</text>
            <text x="16" y="58" class="mono bold" font-size="20" fill="#38BDF8">36 Siswa</text>
            <text x="16" y="78" class="sans regular" font-size="10" fill="#64748B">100% Biodata Terisi</text>
          </g>

          <!-- Card 3: PR Aktif -->
          <g transform="translate(436, 0)">
            <rect width="202" height="95" rx="10" fill="url(#metricCardGrad)" stroke="#1E293B" stroke-width="1" />
            <text x="16" y="28" class="sans regular" font-size="11" fill="#94A3B8">TUGAS &amp; PR AKTIF</text>
            <text x="16" y="58" class="mono bold" font-size="20" fill="#F59E0B">3 Tugas</text>
            <text x="16" y="78" class="sans regular" font-size="10" fill="#64748B">Auto-Reminder 19:00 WIB</text>
          </g>

          <!-- Card 4: Blok KBM -->
          <g transform="translate(654, 0)">
            <rect width="206" height="95" rx="10" fill="url(#metricCardGrad)" stroke="#1E293B" stroke-width="1" />
            <text x="16" y="28" class="sans regular" font-size="11" fill="#94A3B8">STATUS JADWAL BLOK</text>
            <text x="16" y="58" class="sans bold" font-size="18" fill="#A855F7">BLOK BENGKEL</text>
            <text x="16" y="78" class="sans regular" font-size="10" fill="#EC4899">Wajib Wearpack &amp; Shoes</text>
          </g>
        </g>

        <!-- Two Column Detailed Section -->
        <g transform="translate(0, 190)">
          <!-- Left Col: Mini Jadwal Card (Width: 510) -->
          <g transform="translate(0, 0)">
            <rect width="510" height="360" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
            <text x="20" y="32" class="sans semibold" font-size="14" fill="#F8FAFC">Jadwal Pelajaran Hari Ini (Senin)</text>
            <rect x="390" y="16" width="100" height="24" rx="12" fill="#2E1065" stroke="#7C3AED" stroke-width="0.8" />
            <text x="408" y="32" class="sans bold" font-size="10" fill="#D8B4FE">BENGKEL</text>

            <!-- Schedule Items -->
            <g transform="translate(20, 56)">
              <!-- Slot 1 -->
              <rect width="470" height="70" rx="8" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
              <text x="16" y="26" class="sans semibold" font-size="13" fill="#F8FAFC">Pemrograman Web &amp; Perangkat Bergerak</text>
              <text x="16" y="44" class="sans regular" font-size="11" fill="#94A3B8">Guru: Pak Rasyid • Ruang: Lab Komputer 3</text>
              <text x="16" y="58" class="mono" font-size="10" fill="#38BDF8">07:00 - 11:30 WIB</text>

              <!-- Slot 2 -->
              <g transform="translate(0, 80)">
                <rect width="470" height="70" rx="8" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
                <text x="16" y="26" class="sans semibold" font-size="13" fill="#F8FAFC">Basis Data Relasional &amp; SQLite WAL</text>
                <text x="16" y="44" class="sans regular" font-size="11" fill="#94A3B8">Guru: Bu Ratna • Ruang: Bengkel RPL</text>
                <text x="16" y="58" class="mono" font-size="10" fill="#38BDF8">12:30 - 15:00 WIB</text>
              </g>

              <!-- Wearpack Alert Banner inside card -->
              <g transform="translate(0, 160)">
                <rect width="470" height="42" rx="6" fill="#1C1917" stroke="#EA580C" stroke-width="0.8" />
                <circle cx="20" cy="21" r="5" fill="#F97316" />
                <text x="34" y="25" class="sans regular" font-size="11" fill="#FDBA74">Perhatian: Siswa diwajibkan mengenakan Wearpack Lengkap &amp; Sepatu Safety.</text>
              </g>
            </g>
          </g>

          <!-- Right Col: Mini Transaksi Kas (Width: 350) -->
          <g transform="translate(530, 0)">
            <rect width="330" height="360" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
            <text x="20" y="32" class="sans semibold" font-size="14" fill="#F8FAFC">Mutasi Keuangan Terakhir</text>

            <!-- Table Rows -->
            <g transform="translate(20, 56)">
              <!-- Row 1 -->
              <rect width="290" height="46" rx="6" fill="#1E293B" />
              <text x="12" y="20" class="sans regular" font-size="11" fill="#F8FAFC">Kas Mingguan (Minggu 16)</text>
              <text x="12" y="34" class="mono" font-size="9" fill="#64748B">31 Okt 2026</text>
              <text x="210" y="27" class="mono bold" font-size="12" fill="#10B981">+Rp180.000</text>

              <!-- Row 2 -->
              <g transform="translate(0, 54)">
                <rect width="290" height="46" rx="6" fill="#1E293B" />
                <text x="12" y="20" class="sans regular" font-size="11" fill="#F8FAFC">Beli Spidol &amp; Penghapus Lab</text>
                <text x="12" y="34" class="mono" font-size="9" fill="#64748B">30 Okt 2026</text>
                <text x="220" y="27" class="mono bold" font-size="12" fill="#EF4444">-Rp25.000</text>
              </g>

              <!-- Row 3 -->
              <g transform="translate(0, 108)">
                <rect width="290" height="46" rx="6" fill="#1E293B" />
                <text x="12" y="20" class="sans regular" font-size="11" fill="#F8FAFC">Infaq Jumat Berkah</text>
                <text x="12" y="34" class="mono" font-size="9" fill="#64748B">29 Okt 2026</text>
                <text x="215" y="27" class="mono bold" font-size="12" fill="#10B981">+Rp50.000</text>
              </g>

              <!-- Button CTA -->
              <g transform="translate(0, 175)">
                <rect width="290" height="34" rx="6" fill="url(#primaryBtn)" />
                <text x="88" y="22" class="sans semibold" font-size="12" fill="#FFFFFF">Buka Rekap Lengkap →</text>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
