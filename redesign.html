<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kastor AI · v2</title>
<style>
:root{--bg:#0b0d12;--s1:#12151c;--s2:#181c26;--line:#262c3a;--tx:#eef0f5;--mu:#8b93a7;--ac:#e5484d;--acs:rgba(229,72,77,.14);--ok:#3ecf8e;--wn:#f5b546;--r:16px}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.mo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--s2);font-weight:600;font-size:13px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.g{border:0;background:none;color:var(--mu)}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo .m{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#e5484d,#f97316);display:grid;place-items:center;font-weight:800;color:#fff}
.logo b{font-size:15px;display:block}.logo small{color:var(--mu);font-size:11px}
.cls{margin:0 4px 16px;padding:12px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.cls small{color:var(--mu);font-size:11px}.cls div{font-weight:600;margin-top:2px;display:flex;justify-content:space-between;align-items:center}
.lbl{color:var(--mu);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:14px 12px 8px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mu);text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a:hover{background:var(--s2);color:var(--tx)}
.nav a.on{background:var(--acs);color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
.nav a.on svg{color:var(--ac)}
.me{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700}
.me b{display:block;font-size:13px}.me small{color:var(--mu);font-size:11px}
main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:rgba(11,13,18,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.top h1{font-size:18px;margin:0;letter-spacing:-.01em}
.top small{color:var(--mu);font-size:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:38px;width:300px;color:var(--mu)}
.search input{background:none;border:0;outline:0;color:var(--tx);width:100%;font:inherit}
.wrap{padding:24px 28px 48px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.st small{color:var(--mu);font-size:12px;display:flex;justify-content:space-between;align-items:center}
.st .n{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:10px}
.st .d{font-size:12px;color:var(--mu);margin-top:4px}
.st.hi{background:linear-gradient(160deg,#e5484d,#b91c1c);border:0;color:#fff}
.st.hi small,.st.hi .d{color:rgba(255,255,255,.8)}
.g2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.ph h2{font-size:15px;margin:0}.ph small{color:var(--mu);font-size:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--s2);margin-bottom:8px}
.row b{display:block;font-size:14px}.row small{color:var(--mu);font-size:12px}
.row .r{margin-left:auto;text-align:right}
.pill{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--s1);border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:rgba(62,207,142,.3);background:rgba(62,207,142,.1)}
.pill.wn{color:var(--wn);border-color:rgba(245,181,70,.3);background:rgba(245,181,70,.1)}
.pill.hi{color:#ff8a8d;border-color:rgba(229,72,77,.4);background:var(--acs)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{text-align:left;color:var(--mu);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:12px;background:var(--s2)}
.tbl td{padding:12px;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{padding-left:16px}
.tbl th:last-child,.tbl td:last-child{text-align:right;padding-right:16px}
.tbl small{display:block;color:var(--mu);font-size:12px}
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--s1)}
.acts{display:inline-flex;gap:6px}
.acts button{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--s2);font-size:12px;font-weight:600}
.acts .d{color:#ff8a8d}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.chips button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-weight:600;font-size:13px;white-space:nowrap}
.chips button.on{background:var(--tx);color:#0b0d12;border-color:var(--tx)}
.kasc{width:100%}
.kasc th:nth-child(1),.kasc td:nth-child(1){width:90px}
.kasc th:nth-child(2),.kasc td:nth-child(2){width:60%}
.kasc th:last-child,.kasc td:last-child{text-align:left;padding-left:28px;padding-right:12px}
.mcards{display:none}
.dd{position:relative;display:inline-block}
.ddm{position:absolute;top:calc(100% + 6px);left:0;min-width:200px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.45);display:none;z-index:40;max-height:320px;overflow:auto}
.ddm.open{display:block}
.ddm button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;color:var(--tx);font-weight:600;font-size:14px}
.ddm button:hover{background:var(--s2)}
.ddm button.on{color:var(--ac)}
.cls .ddm{display:none}
.cls .ddm.open{display:block}
.mc{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.mc .t{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mc b{display:block;font-size:15px}.mc small{color:var(--mu);font-size:12px}
.mc .f{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.mc .f span{font-size:12px;color:var(--mu)}
.bn{display:none}
.mnav{display:none}
.dx{display:none}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(800px 400px at 50% -10%,rgba(229,72,77,.22),transparent 60%),var(--bg)}
.lc{width:100%;max-width:400px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:30px 24px}
.lc h1{font-size:24px;margin:18px 0 6px;letter-spacing:-.02em}
.lc p{margin:0 0 22px;color:var(--mu)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);padding:4px;border-radius:12px;margin-bottom:18px}
.seg button{border:0;background:none;padding:10px;border-radius:9px;color:var(--mu);font-weight:600}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.lc label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:#c9cedb}
.lc input,.fld{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);padding:0 14px;font:inherit;font-size:16px}
.lc input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.lc .btn{width:100%;justify-content:center;height:50px;margin-top:22px;font-size:15px}
.hide{display:none!important}
.ck{width:32px;height:32px;border-radius:9px;border:2px solid #3a4256;background:var(--s2);display:inline-grid;place-items:center;cursor:pointer;flex:none;padding:0;color:#052e1f}
.ck.on{background:var(--ok);border-color:var(--ok)}
.kas3{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.kas3{grid-template-columns:1fr 1fr!important;gap:10px}.kas3 .card{padding:12px 14px}.kas3 .card:last-child{grid-column:1/-1}.kas3 .n{font-size:20px;margin-top:6px}.kas3 .d{font-size:11px}.kas3 small{font-size:11px}.jdadd{width:100%;justify-content:center}}
.jdadd{margin-left:auto}
.lc .swap{margin:30px 0 0;text-align:center;color:var(--mu);font-size:13px}
.swap a{color:var(--ac);font-weight:700;text-decoration:none}
#fl,#fr{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.meter span{height:4px;border-radius:4px;background:var(--line)}
.sm{font-size:12px;color:var(--mu);margin-top:6px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:19;display:none}
.scrim.open{display:block}
.xb{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--s2);display:grid;place-items:center;color:var(--tx);cursor:pointer}
.sheet{position:fixed;inset:auto 0 0 0;background:var(--s1);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:20;display:none}
.sheet.open{display:block}
.sheet .grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px}
.sheet a{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;color:var(--tx);text-decoration:none;font-weight:600}
.sheet a:hover{background:var(--s2)}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .hd{display:none!important}
  aside{display:flex!important;position:fixed;left:0;top:0;bottom:0;width:280px;height:100vh;transform:translateX(-102%);transition:transform .25s ease;z-index:30;box-shadow:0 0 40px rgba(0,0,0,.5)}
  aside.open{transform:none}
  .mnav{display:inline-flex}
  .dx{display:grid;position:absolute;top:14px;right:14px}
  .top{padding:12px 16px}
  .search{display:none}
  .wrap{padding:16px 14px 110px}
  .stats{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .tw.dt{display:none}
  .mcards{display:block}
  .bn{display:none!important;grid-template-columns:repeat(5,minmax(0,1fr));justify-items:center;position:fixed;bottom:0;left:0;right:0;background:rgba(18,21,28,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
  .bn a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mu);text-decoration:none;padding:6px 0;border-radius:12px;font-weight:600}
  .bn a.on{color:var(--tx)}
  .bn a.on .ico{background:var(--acs);color:var(--ac)}
  .bn .ico{width:44px;height:28px;border-radius:999px;display:grid;place-items:center}
  .fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));height:52px;padding:0 18px;border-radius:999px;border:0;background:var(--ac);color:#fff;font-weight:700;box-shadow:0 12px 28px rgba(229,72,77,.35);z-index:9;display:inline-flex;align-items:center;gap:8px}
}
.fab{display:none}
@media (max-width:480px){.stats{grid-template-columns:1fr 1fr}.st .n{font-size:22px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim" onclick="sheet(false)"></div><div class="sheet" id="sheet"><div class="grab"></div><button class="xb" onclick="sheet(false)" aria-label="Tutup"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <a href="#siswa">Data Siswa</a><a href="#rekap">Buku Kas &amp; Rekap</a><a href="#tugas">Tugas &amp; PR</a><a href="#admin">Administrasi Kelas</a><a href="#dev">Developer Console</a><a href="#" onclick="logout();return false" style="color:#ff8a8d;margin-top:8px;border-top:1px solid var(--line);border-radius:0;padding-top:16px">Keluar</a>
  
</div>
<script>
const I={
  home:'<path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/>',
  users:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/>',
  cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
  wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M16 13h2"/><path d="M3 10h18"/>',
  file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  term:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>'
};
const ic=(k,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24">${I[k]}</svg>`;
const menu=[['dashboard','Dashboard','home'],['siswa','Data Siswa','users'],['jadwal','Jadwal Pelajaran','cal'],['kas','Kas Kelas','wallet'],['rekap','Buku Kas & Rekap','file'],['tugas','Tugas & PR','file'],['admin','Administrasi Kelas','layers'],['dev','Developer Console','term']];
const bnav=[['dashboard','Beranda','home'],['siswa','Siswa','users'],['jadwal','Jadwal','cal'],['kas','Kas','wallet'],['more','Lainnya','more']];
const siswa=[
 ['01','Siswa Contoh A','Kota Contoh','20001','6281200000001'],
 ['02','Siswa Contoh B','Kota Contoh','20002','6281200000002'],
 ['03','Siswa Contoh C','Kota Contoh','20003','6281200000003'],
 ['04','Siswa Contoh D','Kota Contoh','20004','6281200000004']
];
const KELAS=[['XI RPL C','36 siswa'],['XI RPL A','34 siswa'],['Pribadi','0 siswa']];
let kelasIdx=0;
function kelasOpts(){return KELAS.map((k,i)=>`<option value="${i}" ${i===kelasIdx?'selected':''}>${k[0]} (${k[1]})</option>`).join('')}
function setKelas(i){kelasIdx=+i;route()}
function ddToggle(id){const m=document.getElementById('dd-'+id);const o=!m.classList.contains('open');document.querySelectorAll('.ddm.open').forEach(x=>x.classList.remove('open'));m.classList.toggle('open',o)}
document.addEventListener('click',e=>{if(!e.target.closest('.dd')){document.querySelectorAll('.ddm.open').forEach(m=>m.classList.remove('open'))}});
function sheet(o){document.getElementById('sheet').classList.toggle('open',o);document.getElementById('scrim').classList.toggle('open',o);const a=document.querySelector('aside');if(a)a.classList.remove('open')}
function toggleNav(o){const a=document.querySelector('aside');if(a)a.classList.toggle('open',o);document.getElementById('scrim').classList.toggle('open',o)}
function shell(id,title,sub,body,action=''){
  return `<div class="shell">
  <aside>
    <button class="xb dx" onclick="sheet(false)" aria-label="Tutup"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="logo"><div class="m">K</div><div><b>Kastor AI</b><small>Classroom OS</small></div></div>
    <div class="cls${role==='developer'?' dd':''}" style="cursor:pointer;display:block" onclick="${role==='developer'?"ddToggle('kls')":''}"><small>Kelas</small><div>${KELAS[kelasIdx][0]} (${KELAS[kelasIdx][1]}) <span style="color:var(--mu);font-size:12px">▾</span></div><div class="ddm" id="dd-kls" style="left:0;right:0">${KELAS.map((k,i)=>`<button class="${i===kelasIdx?'on':''}" onclick="setKelas(${i})">${k[0]} (${k[1]})</button>`).join('')}</div></div>
    <div class="lbl">Administrasi</div>
    <nav class="nav">${menu.filter(([k])=>canOpen(k)).map(([k,l,i])=>`<a href="#${k}" class="${k===id?'on':''}">${ic(i)}${l}</a>`).join('')}</nav>
    <div class="me"><div class="av">R</div><div style="flex:1;min-width:0"><b>Rasyid</b><small class="mo">Developer</small></div><a href="#" onclick="logout();return false" title="Keluar" style="color:var(--mu)">${ic('out')}</a></div>
  </aside>
  <main>
    <div class="top"><div style="display:flex;gap:12px;align-items:center"><button class="btn g mnav" onclick="toggleNav(true)" aria-label="Menu">${ic('menu')}</button><div><small>Kastor AI / ${sub}</small><h1>${title}</h1></div></div>
      <div style="display:flex;gap:10px;align-items:center"><div class="search">${ic('search')}<input placeholder="Cari siswa, tugas, atau NIS"></div><button class="btn g" aria-label="Notifikasi">${ic('bell')}</button></div></div>
    <div class="wrap">${body}</div>
  </main>
</div>
<nav class="bn">${bnav.map(([k,l,i])=>`<a href="#${k==='more'?'':k}" ${k==='more'?'onclick="event.preventDefault();sheet(true)"':''} class="${k===id?'on':''}"><span class="ico">${ic(i)}</span>${l}</a>`).join('')}</nav>
${action}`;
}
const P={
 login(){return `<div class="login"><div class="lc">
   <div class="logo" style="padding:0"><div class="m">K</div><div><b>Kastor AI</b><small>Portal pengurus</small></div></div>
   <h1 id="t">Selamat datang</h1><p id="s">Masuk untuk mengelola kelas XI RPL C.</p>
   
   <div id="fl"><label>Nomor WhatsApp</label><input id="lwa" type="tel" placeholder="08xxxxxxxxxx" oninput="detectRole()"><label>Kata sandi</label><input type="password" placeholder="Kata sandi kamu"><div id="rdet" class="sm" style="margin-top:14px;min-height:18px"></div><button class="btn p" style="width:100%;justify-content:center;margin-top:10px;height:50px" onclick="doLogin()">Masuk ke dashboard</button><p class="swap">Belum punya akun? <a href="#" onclick="auth(0);return false">Daftar sekarang</a></p></div>
   <div id="fr" class="hide"><label>Nomor WhatsApp pengurus</label><input type="tel" placeholder="08xxxxxxxxxx"><label>Buat kata sandi</label><input id="np" type="password" placeholder="Minimal 8 karakter" oninput="pw()"><div class="meter" id="mt"><span></span><span></span><span></span><span></span></div><div class="sm" id="sl">Belum diisi</div><label>Ulangi kata sandi</label><input id="cp" type="password" placeholder="Ketik ulang" oninput="pw()"><div class="sm" id="mc"></div><button class="btn p" id="db" disabled>Daftar sebagai pengurus</button><p class="swap">Sudah punya akun? <a href="#" onclick="auth(1);return false">Masuk</a></p></div>
 </div></div>`},
 dashboard(){return shell('dashboard','Dashboard','Ringkasan',`
  <div class="stats">
    <div class="card st hi"><small>Siswa terdata</small><div class="n">36</div><div class="d">1 jabatan pengurus aktif</div></div>
    <div class="card st"><small>Kas minggu ini <span class="pill ok">Lunas 31</span></small><div class="n">Rp1,2jt</div><div class="d">Menunggak 5 siswa</div></div>
    <div class="card st"><small>Tugas aktif</small><div class="n">4</div><div class="d">2 tenggat minggu ini</div></div>
    <div class="card st"><small>Minggu berjalan</small><div class="n">18</div><div class="d">TA 2026/2027</div></div>
  </div>
